services:
  db:
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragsecret
      POSTGRES_DB: ragdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: rag-assistant
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rag:ragsecret@db:5432/ragdb
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    # Remove the volumes block for now
    # volumes:
    #   - .:/app

volumes:
  pgdata: