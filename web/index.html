<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Secure Enterprise RAG Assistant</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    label, select, input, button, textarea { display: block; margin: 0.5rem 0; }
    textarea { width: 100%; height: 4rem; }
    .answer { background: #f6f6f6; padding: 1rem; margin-top: 1rem; white-space: pre-wrap; }
    .trace { font-size: 0.85rem; color: #555; }
  </style>
</head>
<body>
  <h1>Secure Enterprise RAG Assistant</h1>

  <label>Ask as:
    <select id="username">
      <option value="alice">Alice (engineering)</option>
      <option value="bob">Bob (HR)</option>
      <option value="carol">Carol (finance)</option>
      <option value="guest">Guest</option>
    </select>
  </label>

  <label>Question
    <textarea id="question">Who may push to production?</textarea>
  </label>
  <button id="ask">Ask</button>

  <div id="result"></div>

  <script>
    document.getElementById("ask").onclick = async () => {
      const username = document.getElementById("username").value;
      const question = document.getElementById("question").value;
      const result = document.getElementById("result");
      result.innerHTML = "<p>Thinking…</p>";

      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, username }),
      });
      const data = await res.json();

      let html = `<div class="answer"><strong>${data.answered ? "Answer" : "Escalated"}</strong><br>${data.answer}</div>`;
      if (data.citations?.length) {
        html += "<h3>Citations</h3><ul>";
        for (const c of data.citations) {
          html += `<li>${c.grounded ? "✓" : "✗"} ${c.source}<br><em>${c.quote}</em></li>`;
        }
        html += "</ul>";
      }
      if (data.trace?.length) {
        html += "<h3>Trace</h3><div class=\"trace\">" + data.trace.join("<br>") + "</div>";
      }
      result.innerHTML = html;
    };
  </script>
</body>
</html>
